name: Deploy to GitHub Pages

# Builds and publishes the Angular site to the `gh-pages` branch.
# Requires GitHub Pages to serve from branch `gh-pages` (root folder).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build for GitHub Pages
        run: npm run build:pages

      - name: Deploy to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd dist/sigat-website/browser
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -qb gh-pages
          git add -A
          git commit -qm "deploy: $GITHUB_SHA"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push -fq origin gh-pages
          echo "Published dist/sigat-website/browser to gh-pages"

